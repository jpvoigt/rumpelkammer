name: Python checks
description: Führt Python-Prüfungen aus

inputs:
  python-version:
    required: false
    default: "3.14"

outputs:
  result:
    description: "Ergebnis"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - run: python -m pip install -r $GITHUB_ACTION_PATH/requirements.txt
      shell: bash

    - run: python $GITHUB_ACTION_PATH/main.py
      shell: bash
